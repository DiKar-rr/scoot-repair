<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-label="Electric scooter on a workshop stand" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<radialGradient id="g" cx="50%" cy="45%" r="55%"><stop offset="0" stop-color="#39ff14" stop-opacity=".28"/><stop offset="1" stop-color="#39ff14" stop-opacity="0"/></radialGradient>
<linearGradient id="b" x1="0" x2="1"><stop offset="0" stop-color="#39ff14" stop-opacity=".55"/><stop offset="1" stop-color="#39ff14" stop-opacity="0"/></linearGradient>
<pattern id="p" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#39ff14" stroke-opacity=".07"/></pattern>
</defs>
<rect width="640" height="480" rx="40" fill="#0b1510"/>
<rect width="640" height="480" rx="40" fill="url(#p)"/>
<circle cx="320" cy="230" r="270" fill="url(#g)"/>
<!-- workbench -->
<rect x="60" y="410" width="520" height="22" rx="11" fill="#17261c"/>
<rect x="60" y="410" width="520" height="4" rx="2" fill="#39ff14"/>
<rect x="110" y="432" width="16" height="30" fill="#17261c"/><rect x="514" y="432" width="16" height="30" fill="#17261c"/>
<!-- headlight beam -->
<path d="M548 118 L640 70 V190 Z" fill="url(#b)" opacity=".7"/>
<!-- wheels -->
<g>
<circle cx="170" cy="340" r="66" fill="#050a07" stroke="#2b4033" stroke-width="6"/>
<circle cx="170" cy="340" r="44" fill="none" stroke="#39ff14" stroke-width="5"/>
<circle cx="170" cy="340" r="12" fill="#39ff14"/>
<path d="M170 296V384M126 340H214M139 309L201 371M201 309L139 371" stroke="#39ff14" stroke-opacity=".35" stroke-width="3"/>
<circle cx="490" cy="340" r="66" fill="#050a07" stroke="#2b4033" stroke-width="6"/>
<circle cx="490" cy="340" r="44" fill="none" stroke="#39ff14" stroke-width="5"/>
<circle cx="490" cy="340" r="12" fill="#39ff14"/>
<path d="M490 296V384M446 340H534M459 309L521 371M521 309L459 371" stroke="#39ff14" stroke-opacity=".35" stroke-width="3"/>
</g>
<!-- rear fender + deck -->
<path d="M96 322 A76 76 0 0 1 244 322" fill="none" stroke="#e8f5ec" stroke-width="10" stroke-linecap="round"/>
<rect x="150" y="310" width="360" height="34" rx="17" fill="#e8f5ec"/>
<rect x="190" y="320" width="250" height="14" rx="7" fill="#0b1510"/>
<rect x="196" y="324" width="170" height="6" rx="3" fill="#39ff14"/>
<!-- stem + bar -->
<path d="M498 318 L534 112" stroke="#e8f5ec" stroke-width="16" stroke-linecap="round"/>
<path d="M500 322 L492 340" stroke="#e8f5ec" stroke-width="14" stroke-linecap="round"/>
<path d="M508 104 H580" stroke="#e8f5ec" stroke-width="14" stroke-linecap="round"/>
<path d="M566 104 H584" stroke="#39ff14" stroke-width="14" stroke-linecap="round"/>
<rect x="522" y="82" width="42" height="18" rx="6" fill="#0b1510" stroke="#39ff14" stroke-width="3"/>
<rect x="530" y="88" width="20" height="6" rx="3" fill="#39ff14"/>
<circle cx="552" cy="124" r="10" fill="#39ff14"/>
<!-- gear -->
<g transform="translate(120 140)">
<circle r="34" fill="none" stroke="#39ff14" stroke-width="14" stroke-dasharray="11 10.7"/>
<circle r="26" fill="#0b1510" stroke="#39ff14" stroke-width="6"/><circle r="9" fill="#39ff14"/>
</g>
<!-- wrench -->
<g transform="translate(300 150) rotate(-40)" fill="none" stroke="#e8f5ec" stroke-width="12" stroke-linecap="round">
<path d="M-70 0H50"/><path d="M50 -16 A20 20 0 1 1 50 16" stroke-width="10"/>
</g>
<!-- sparks -->
<g stroke="#39ff14" stroke-width="5" stroke-linecap="round"><path d="M260 238l-16-16M284 226l-4-20M240 262l-22-4"/></g>
<!-- badge -->
<rect x="56" y="236" width="150" height="56" rx="28" fill="#39ff14"/>
<text x="131" y="272" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="800" fill="#04120a">30 min</text>
</svg>
